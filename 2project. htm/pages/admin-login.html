
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Internship Portal</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #34205d, transparent 45%),
                #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #18233f;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8b5cf6;
        }

        .logo {
            color: #c4b5fd;
            font-size: 21px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #facc15;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            border-radius: 22px;
            background: #18233f;
            border: 1px solid #8b5cf6;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .admin-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #34205d;
            border: 2px solid #a78bfa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: white !important;
            font-size: 29px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1 !important;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #c4b5fd;
            font-weight: bold;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #263453;
            border: 1px solid #6473a0;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: #c4b5fd;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #6d28d9;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #7f1d1d;
            color: #fecaca;
            text-align: center;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 16px;
            color: #c4b5fd;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            color: #facc15;
        }

        .security-note {
            text-align: center;
            color: #94a3b8 !important;
            font-size: 12px;
            margin-top: 25px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #151d35;
            color: #cbd5e1;
        }

        @media(max-width: 480px) {
            .login-card {
                padding: 25px;
            }

            .navbar {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">IMS | Admin Portal</div>
        <a href="../1project.html">← Back to Home</a>
    </nav>

    <main class="main-container">

        <div class="login-card">

            <div class="admin-icon">🛡️</div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Welcome back! Sign in to manage your portal.
            </p>

            <form id="adminLoginForm">

                <label for="adminEmail">Admin Email</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >

                <label for="adminPassword">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

                <a href="#" class="forgot" onclick="forgotPassword(event)">
                    Forgot Password?
                </a>

                <button type="submit" class="login-btn">
                    Sign In to Dashboard →
                </button>

                <div class="error" id="errorMessage">
                    Invalid email or password. Please try again.
                </div>

            </form>

            <p class="security-note">
                Authorized administrator access only.<br>
                Internship Management System © 2026
            </p>

        </div>

    </main>

    <footer>
        Internship Management System | Admin Portal
    </footer>

    <script>

        // Already logged-in admin
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            window.location.replace("admin.html");
        }

        // Demo login credentials
        const ADMIN_EMAIL = "admin@internship.com";
        const ADMIN_PASSWORD = "Admin@123";

        // Login function
        document.getElementById("adminLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email = document.getElementById("adminEmail")
                    .value.trim();

                const password = document.getElementById("adminPassword")
                    .value;

                const error = document.getElementById("errorMessage");

                if (email === ADMIN_EMAIL &&
                    password === ADMIN_PASSWORD) {

                    sessionStorage.setItem("adminLoggedIn", "true");

                    error.style.display = "none";

                    window.location.href = "admin.html";

                } else {

                    error.style.display = "block";

                }

            });

        // Show and hide password
        function togglePassword() {

            const password = document.getElementById("adminPassword");
            const button = document.querySelector(".show-password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }

        }

        // Forgot password
        function forgotPassword(event) {

            event.preventDefault();

            alert(
                "Please contact the project administrator to reset the demo admin password."
            );

        }

    </script>

</body>
</html>
