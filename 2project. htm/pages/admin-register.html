
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Registration</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;display:flex;justify-content:center;
    align-items:center;font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#10152e,#30205d);
    color:white;padding:20px
}
.card{
    width:100%;max-width:420px;background:#1b2140;
    padding:35px;border-radius:18px;
    box-shadow:0 15px 40px #0006
}
h1{text-align:center;color:#f5c542}
p{text-align:center;color:#c4c8dc}
input{
    width:100%;padding:14px;margin:10px 0;
    border:1px solid #444d70;border-radius:9px;
    background:#10152e;color:white;font-size:15px
}
button{
    width:100%;padding:14px;margin-top:15px;
    background:#f5c542;color:#17182c;border:0;
    border-radius:9px;font-weight:bold;cursor:pointer
}
a{color:#f5c542;text-decoration:none}
.links{text-align:center;margin-top:20px}
#message{text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="card">
    <h1>Admin Registration</h1>
    <p>Authorized administrators only</p>

    <form id="registerForm">
        <input id="name" placeholder="Admin Full Name" required>
        <input id="email" type="email" placeholder="Admin Email" required>
        <input id="password" type="password" placeholder="Create Password" required minlength="6">
        <input id="adminCode" type="password" placeholder="Admin Registration Code" required>
        <button type="submit">Register as Admin</button>
    </form>

    <div id="message"></div>

    <div class="links">
        Already registered? <a href="admin-login.html">Admin Login</a>
        <br><br>
        <a href="../1project.html">Back to Home</a>
    </div>
</div>

<script>
const ADMIN_REGISTRATION_CODE = "ADMIN2026";

document.getElementById("registerForm").addEventListener("submit",function(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const code = document.getElementById("adminCode").value;

    const message = document.getElementById("message");

    if(code !== ADMIN_REGISTRATION_CODE){
        message.style.color = "#ff7777";
        message.textContent = "Invalid admin registration code!";
        return;
    }

    let admins = JSON.parse(localStorage.getItem("adminAccounts")) || [];

    if(admins.some(admin => admin.email === email)){
        message.style.color = "#ff7777";
        message.textContent = "This admin email is already registered!";
        return;
    }

    admins.push({name,email,password});
    localStorage.setItem("adminAccounts",JSON.stringify(admins));

    message.style.color = "#7dffad";
    message.textContent = "Registration successful! You can now log in.";

    this.reset();
});
</script>
</body>
</html>
