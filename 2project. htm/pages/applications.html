
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        body { background:#0b1020; color:#fff; font-family:Arial,sans-serif; }
        header { text-align:center; padding:25px; background:#18233f; }
        h1,h2,h3 { color:#fff !important; }
        p { color:#e2e8f0 !important; }
        .container { max-width:1000px; margin:35px auto; padding:20px; }
        .application-card { background:#1b2745; padding:25px; margin-bottom:20px; border:1px solid #6473a0; border-radius:16px; }
        .application-card h3 { color:#c4b5fd !important; }
        .status { display:inline-block; padding:9px 16px; border-radius:20px; font-weight:bold; }
        .pending { background:#fef3c7; color:#92400e !important; }
        .approved { background:#dcfce7; color:#166534 !important; }
        .rejected { background:#fee2e2; color:#991b1b !important; }
        a { color:#c4b5fd; }
    </style>
</head>
<body>

<header>
    <h1>My Applications</h1>
    <p>Track your internship application progress</p>
</header>

<div class="container">
    <div id="applicationList"></div>
    <p><a href="student-dashboard.html">← Back to Dashboard</a></p>
</div>

<script>
const student = JSON.parse(localStorage.getItem("loggedInStudent"));

if (!student) {
    window.location.replace("student.html");
} else {
    const applications = JSON.parse(localStorage.getItem("applications")) || [];

    const myApplications = applications.filter(app =>
        app.email === student.email
    );

    const list = document.getElementById("applicationList");

    if (myApplications.length === 0) {
        list.innerHTML = "<h2>No Applications Yet</h2><p>You have not applied for any internship.</p>";
    } else {
        myApplications.forEach(app => {
            const card = document.createElement("div");
            card.className = "application-card";

            const heading = document.createElement("h3");
            heading.textContent = app.internship;

            const name = document.createElement("p");
            name.textContent = "Student: " + app.name;

            const email = document.createElement("p");
            email.textContent = "Email: " + app.email;

            const status = document.createElement("span");
            status.className = "status " + (
                app.status === "Approved" ? "approved" :
                app.status === "Rejected" ? "rejected" : "pending"
            );
            status.textContent = app.status || "Pending";

            card.append(heading, name, email, status);
            list.appendChild(card);
        });
    }
}
</script>

</body>
</html>
