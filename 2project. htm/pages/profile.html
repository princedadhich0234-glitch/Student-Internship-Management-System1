
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background: #0b1020;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #18233f;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #8b5cf6;
        }

        h1, h2, h3 {
            color: #ffffff !important;
        }

        p {
            color: #e2e8f0 !important;
        }

        .profile-container {
            max-width: 750px;
            margin: 45px auto;
            padding: 20px;
        }

        .profile-card {
            background: #1b2745;
            border: 1px solid #6473a0;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .profile-icon {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #8b5cf6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .profile-card h2 {
            text-align: center;
            color: #c4b5fd !important;
            margin-bottom: 30px;
        }

        .detail {
            background: #263453;
            padding: 17px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid #46547a;
        }

        .detail label {
            display: block;
            color: #c4b5fd;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .detail span {
            color: #ffffff !important;
            font-size: 17px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 13px 25px;
            background: #8b5cf6;
            color: white !important;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #6d28d9;
        }

        @media(max-width:600px) {
            .profile-container {
                margin: 20px auto;
            }

            .profile-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Profile</h1>
    <p>Internship Management System</p>
</header>

<main class="profile-container">

    <div class="profile-card">

        <div class="profile-icon" id="profileInitial">S</div>

        <h2 id="profileName">Student Profile</h2>

        <div class="detail">
            <label>Full Name</label>
            <span id="studentName">Loading...</span>
        </div>

        <div class="detail">
            <label>Roll Number</label>
            <span id="studentRoll">Loading...</span>
        </div>

        <div class="detail">
            <label>Email Address</label>
            <span id="studentEmail">Loading...</span>
        </div>

        <a href="student-dashboard.html" class="back-btn">
            Back to Dashboard
        </a>

    </div>

</main>

<script>
    const student = JSON.parse(
        localStorage.getItem("loggedInStudent")
    );

    if (!student) {
        window.location.replace("student.html");
    } else {

        document.getElementById("profileName").textContent =
            student.name || "Student";

        document.getElementById("studentName").textContent =
            student.name || "Not Available";

        document.getElementById("studentRoll").textContent =
            student.roll || "Not Available";

        document.getElementById("studentEmail").textContent =
            student.email || "Not Available";

        document.getElementById("profileInitial").textContent =
            (student.name || "S").charAt(0).toUpperCase();
    }
</script>

</body>
</html>
